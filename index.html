    <div id="intro" aria-label="Enter the experience">

    <script id="vertex-shader" type="x-shader/x-vertex">
        uniform sampler2D map;
        uniform float width;
        uniform float height;
        uniform float nearClipping;
        uniform float farClipping;
        uniform float pointSize;
        uniform float zOffset;
        uniform float closePlane;
        uniform float farPlane;
        uniform float farPlaneRotation;
        uniform float bottomCrop;
        uniform float densityMix;

        varying vec3 vColor;
        varying float vDensityAlpha;

        const float XtoZ = 1.11146;
        const float YtoZ = 0.83359;
        void main() {
            if (position.y < bottomCrop) {
                gl_PointSize = 0.0;
                gl_Position = vec4(2.0, 2.0, 2.0, 1.0);
                return;
            }

            vec2 videoUv = vec2(position.x / width, position.y / height);
            vec4 color = texture2D(map, videoUv);
            float depth = (color.r + color.g + color.b) / 3.0;
            float z = (1.0 - depth) * (farClipping - nearClipping) + nearClipping;
            vColor = color.rgb;

            // The Low-quality four-pixel lattice remains fully visible. Samples
            // added by Medium/High fade with distance instead of swapping grids.
            float lowColumn = 1.0 - step(0.5, mod(position.x, 4.0));
            float lowRow = 1.0 - step(0.5, mod(position.y, 4.0));
            float lowSample = lowColumn * lowRow;
            vDensityAlpha = mix(densityMix, 1.0, lowSample);

            float pointX = (position.x / width - 0.5) * z * XtoZ;
            float pointY = (position.y / height - 0.5) * z * YtoZ;
            float cutAngle = radians(farPlaneRotation);
            float rotatedFarDepth = z * cos(cutAngle) - pointY * sin(cutAngle);

            if (z < closePlane || rotatedFarDepth > farPlane) {
                gl_PointSize = 0.0;
                gl_Position = vec4(2.0, 2.0, 2.0, 1.0);
                return;
            }

            vec4 pointPosition = vec4(
                pointX,
                pointY,
                -z + zOffset,
                1.0
            );

            gl_PointSize = pointSize;
            gl_Position = projectionMatrix * modelViewMatrix * pointPosition;
        }
    </script>

    <script id="fragment-shader" type="x-shader/x-fragment">
        varying vec3 vColor;
        varying float vDensityAlpha;

        void main() {
            if (vDensityAlpha < 0.001) {
                discard;
            }
            gl_FragColor = vec4(vColor, vDensityAlpha);
        }
    </script>

    <script id="post-fragment-shader" type="x-shader/x-fragment">
        uniform sampler2D sceneTexture;
        uniform vec2 resolution;
        uniform float bloomStrength;
        uniform float blueHue;

        varying vec2 vUv;

        float luminance(vec3 color) {
            return dot(color, vec3(0.2126, 0.7152, 0.0722));
        }

        vec3 brightSample(vec2 offset) {
            vec3 color = texture2D(sceneTexture, vUv + offset / resolution).rgb;
            float brightness = max(max(color.r, color.g), color.b);
            return color * smoothstep(0.28, 0.82, brightness);
        }

        void main() {
            vec4 baseSample = texture2D(sceneTexture, vUv);
            vec3 base = baseSample.rgb;
            vec3 bloom = vec3(0.0);

            // A few weighted rings make the glow extend beyond a single point
            // without the cost of a second blur target/pass.
            bloom += brightSample(vec2(-2.0, 0.0)) * 0.34;
            bloom += brightSample(vec2(2.0, 0.0)) * 0.34;
            bloom += brightSample(vec2(0.0, -2.0)) * 0.34;
            bloom += brightSample(vec2(0.0, 2.0)) * 0.34;
            bloom += brightSample(vec2(-4.0, -4.0)) * 0.20;
            bloom += brightSample(vec2(4.0, -4.0)) * 0.20;
            bloom += brightSample(vec2(-4.0, 4.0)) * 0.20;
            bloom += brightSample(vec2(4.0, 4.0)) * 0.20;
            bloom += brightSample(vec2(-8.0, 0.0)) * 0.12;
            bloom += brightSample(vec2(8.0, 0.0)) * 0.12;
            bloom += brightSample(vec2(0.0, -8.0)) * 0.12;
            bloom += brightSample(vec2(0.0, 8.0)) * 0.12;
            bloom *= vec3(0.58, 0.84, 1.32) * bloomStrength / 2.64;

            float light = luminance(base);
            vec3 coolGrade = vec3(light * 0.92, light * 0.97, light * 1.08);
            vec3 graded = mix(base, coolGrade, blueHue);

            float bloomCoverage = clamp(luminance(bloom) * 2.0, 0.0, 1.0);
            gl_FragColor = vec4(
                graded + bloom,
                max(baseSample.a, bloomCoverage)
            );
        }
    </script>

    <script type="module">
        import * as THREE from './assets/vendor/three.module.js';
        import { GUI } from './assets/vendor/lil-gui.module.min.js';

        const VIDEO_WIDTH = 640;
        const VIDEO_HEIGHT = 480;
        const QUALITY_STRIDES = {
            Low: 4,
            Medium: 2,
            High: 1
        };
        const MIN_PIXEL_RATIO = 0.75;
        const CAMERA_MAX_SPEED = 800;
        const CAMERA_MAX_ACCELERATION = 1000;
        const CAMERA_SPRING_STRENGTH = 4;
        const CAMERA_DAMPING = 5;
        const CAMERA_ACCELERATION_RESPONSE = 2.5;
        const CAMERA_SPEED_FADE_START = 0.65;
        const CAMERA_SPEED_LOOKAHEAD = 0.4;
        const CAMERA_POSITION_EPSILON = 0.5;
        const CAMERA_VELOCITY_EPSILON = 3;
        const CAMERA_ACCELERATION_EPSILON = 2;
        const POINTER_SCALE = 9;
        const WOBBLE_WIDTH_PIXELS = 200;
        const WOBBLE_HEIGHT_PIXELS = 120;
        const CAMERA_ENTRANCE_DURATION = 15000;
        const CAMERA_AUDIO_PAN_RANGE = 3200;
        const AUDIO_MAX_PAN = 0.2;
        const AUDIO_PAN_RESPONSE = 1.6;
        const AUDIO_FADE_DURATION = 8;
        const AUDIO_MIN_VOLUME = 0.3;
        const AUDIO_MAX_SPEED_VOLUME = 700;
        const AUDIO_SPEED_RESPONSE = 0.9;
        const AUDIO_VOLUME_RESPONSE = 1.5;
        const AUDIO_MUTE_RESPONSE = 12;
        const POINT_DENSITY_NEAR_DISTANCE = 1400;
        const POINT_DENSITY_FAR_DISTANCE = 9000;
        const MAX_FRAME_DELTA = 0.05;
        const TIMELINE_SCRUB_INTERVAL = 1000;
        const TIMELINE_SCRUB_CODES = new Set(['Comma']);
        const RANDOM_SKIP_MIN_SECONDS = 30;
        const RANDOM_SKIP_MAX_SECONDS = 120;

        let camera;
        let renderer;
        let sceneRenderTarget;
        let postScene;
        let postCamera;
        let postMaterial;
        let mesh;
        let scene;
        let controlsGui;
        let controlsVisible = false;
        let renderRequest = 0;
        let renderRequested = false;
        let fallbackFrameTimer = 0;
        let wasPlayingBeforeHidden = false;
        let performanceWindowStarted = performance.now();
        let deliveredVideoFrames = 0;
        let stablePerformanceWindows = 0;
        let lastRenderTime = 0;
        let timelineScrubTimer = 0;
        let timelineScrubActive = false;
        let timelineMomentDeck = [];
        let titleFlashTimer = 0;
        let lastRandomSkipTime = -1;
        let experienceStarted = false;
        let cameraEntranceActive = false;
        let cameraEntranceStartedAt = 0;
        let audioContext;
        let audioSource;
        let stereoPanner;
        let audioGain;
        let currentAudioPan = 0;
        let audioFadeStartedAt = 0;
        let smoothedCameraSpeed = 0;
        let currentMovementVolume = AUDIO_MIN_VOLUME;
        let currentAudioOutputVolume = 0;
        let audioCameraPositionInitialized = false;
        let audioMuted = false;
        let wasSoundtrackPlayingBeforeHidden = false;

        const pointer = new THREE.Vector2();
        const cameraVelocity = new THREE.Vector2();
        const cameraTarget = new THREE.Vector2();
        const cameraTargetDelta = new THREE.Vector2();
        const cameraAcceleration = new THREE.Vector2();
        const desiredCameraAcceleration = new THREE.Vector2();
        const center = new THREE.Vector3(0, 0, 0);
        // Preserve the original elevation while rotating the horizontal offset
        // 45 degrees for a three-quarter view and scaling the distance by ~3x.
        const cameraEntranceStart = new THREE.Vector3(8275, 8100, 8275);
        const cameraInteractivePosition = new THREE.Vector3(0, 0, 500);
        const cameraEntranceLookTarget = new THREE.Vector3(0, 900, 0);
        const cameraLookTarget = cameraEntranceLookTarget.clone();
        const audioCameraPosition = new THREE.Vector3();
        const postResolution = new THREE.Vector2();
        const heldTimelineKeys = new Set();
        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
        const status = document.querySelector('#status');
        const transportStatus = document.querySelector('#transport-status');
        const viewport = document.querySelector('#viewport');
        const video = document.querySelector('#video');
        const soundtrack = document.querySelector('#soundtrack');
        const intro = document.querySelector('#intro');
        const entryButton = document.querySelector('#entry-button');
        const settings = {
            quality: 'Medium',
            adaptiveResolution: true,
            maxPixelRatio: 1,
            bloomStrength: 0.8,
            blueHue: 0.4
        };
        const performanceState = {
            points: 0,
            pixelRatio: 1,
            videoFps: 0
        };

        init();

        function init() {
            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(
                50,
                window.innerWidth / window.innerHeight,
                1,
                30000
            );
            camera.position.copy(cameraEntranceStart);
            camera.lookAt(cameraLookTarget);

            const texture = new THREE.VideoTexture(video);
            texture.minFilter = THREE.NearestFilter;
            texture.magFilter = THREE.NearestFilter;
            texture.generateMipmaps = false;

            const geometry = createPointGrid(QUALITY_STRIDES[settings.quality]);
            const material = new THREE.ShaderMaterial({
                uniforms: {
                    map: { value: texture },
                    width: { value: VIDEO_WIDTH },
                    height: { value: VIDEO_HEIGHT },
                    nearClipping: { value: 1 },
                    farClipping: { value: 6000 },
                    pointSize: { value: 1 },
                    zOffset: { value: 3313 },
                    closePlane: { value: 1 },
                    farPlane: { value: 2200 },
                    farPlaneRotation: { value: 26 },
                    bottomCrop: { value: 5 },
                    densityMix: { value: 0 }
                },
                vertexShader: document.querySelector('#vertex-shader').textContent,
                fragmentShader: document.querySelector('#fragment-shader').textContent,
                blending: THREE.NormalBlending,
                depthTest: false,
                depthWrite: false,
                transparent: true
            });

            mesh = new THREE.Points(geometry, material);
            mesh.position.set(0, -800, -275);
            mesh.rotation.x = 5.2;
            scene.add(mesh);

            renderer = new THREE.WebGLRenderer({
                antialias: false,
                alpha: true,
                powerPreference: 'high-performance'
            });
            renderer.setClearColor(0x000000, 0);
            setPixelRatio(getMaximumPixelRatio());
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.querySelector('#viewport').appendChild(renderer.domElement);

            createPostProcessing();
            createControls(material);

            window.addEventListener('resize', onResize);
            window.addEventListener('pointermove', onPointerMove, { passive: true });
            window.addEventListener('keydown', onKeyDown);
            window.addEventListener('keyup', onKeyUp);
            window.addEventListener('blur', onWindowBlur);
            document.addEventListener('visibilitychange', onVisibilityChange);
            reducedMotion.addEventListener('change', requestRender);
            entryButton.addEventListener('click', startExperience, { once: true });
            video.addEventListener('playing', () => {
                status.textContent = '';
                status.hidden = true;
                performanceWindowStarted = performance.now();
                deliveredVideoFrames = 0;
                requestRender();
            });
            video.addEventListener('error', () => {
                status.textContent = 'The depth video could not be loaded.';
                status.hidden = false;
            });
            video.addEventListener('seeked', requestRender);
            const renderPausedFirstFrame = () => {
                texture.needsUpdate = true;
                requestRender();
            };
            video.addEventListener('loadeddata', renderPausedFirstFrame, { once: true });
            if (video.readyState >= video.HAVE_CURRENT_DATA) {
                renderPausedFirstFrame();
            }
            soundtrack.addEventListener('error', () => {
                transportStatus.textContent = 'The soundtrack could not be loaded.';
            });

            startRenderScheduler();
            requestRender();
        }

        function startExperience() {
            if (experienceStarted) {
                return;
            }

            experienceStarted = true;
            entryButton.disabled = true;
            entryButton.setAttribute('aria-pressed', 'true');
            document.body.classList.add('experience-started');

            // Both media elements and the Web Audio graph are started directly
            // from the entry gesture so browser autoplay policies are satisfied.
            startSoundtrack();
            startVideo();
            startCameraEntrance(performance.now());
            intro.hidden = true;
            viewport.focus({ preventScroll: true });
        }

        function startCameraEntrance(startTime) {
            cameraEntranceActive = true;
            cameraEntranceStartedAt = startTime;
            camera.position.copy(cameraEntranceStart);
            cameraLookTarget.copy(cameraEntranceLookTarget);
            cameraInteractivePosition.set(0, 0, 500);
            cameraVelocity.set(0, 0);
            cameraAcceleration.set(0, 0);
            desiredCameraAcceleration.set(0, 0);
            audioCameraPosition.copy(camera.position);
            audioCameraPositionInitialized = true;
            requestRender();
        }

        function startSoundtrack() {
            const AudioContextClass = window.AudioContext || window.webkitAudioContext;
            audioFadeStartedAt = performance.now() / 1000;
            currentAudioOutputVolume = 0;

            try {
                if (AudioContextClass && !audioContext) {
                    audioContext = new AudioContextClass();
                    audioSource = audioContext.createMediaElementSource(soundtrack);
                    audioGain = audioContext.createGain();
                    audioGain.gain.value = 0;

                    if (typeof audioContext.createStereoPanner === 'function') {
                        stereoPanner = audioContext.createStereoPanner();
                        stereoPanner.pan.value = 0;
                        audioSource
                            .connect(stereoPanner)
                            .connect(audioGain)
                            .connect(audioContext.destination);
                    } else {
                        audioSource.connect(audioGain).connect(audioContext.destination);
                    }
                }

                if (audioContext?.state === 'suspended') {
                    audioContext.resume().catch(() => {});
                }

                soundtrack.play().catch(() => {
                    transportStatus.textContent = 'Audio playback is blocked by this browser.';
                });
            } catch {
                // The soundtrack can still play normally if Web Audio is not available.
                soundtrack.play().catch(() => {
                    transportStatus.textContent = 'Audio playback is blocked by this browser.';
                });
            }
        }

        function toggleAudioMute() {
            audioMuted = !audioMuted;
            transportStatus.textContent = audioMuted
                ? 'Soundtrack muted. Playback continues.'
                : 'Soundtrack unmuted.';
            requestRender();
        }

        function createPostProcessing() {
            sceneRenderTarget = new THREE.WebGLRenderTarget(1, 1, {
                minFilter: THREE.LinearFilter,
                magFilter: THREE.LinearFilter,
                depthBuffer: true,
                stencilBuffer: false
            });
            sceneRenderTarget.texture.generateMipmaps = false;

            postMaterial = new THREE.ShaderMaterial({
                uniforms: {
                    sceneTexture: { value: sceneRenderTarget.texture },
                    resolution: { value: postResolution },
                    bloomStrength: { value: settings.bloomStrength },
                    blueHue: { value: settings.blueHue }
                },
                vertexShader: `
                    varying vec2 vUv;

                    void main() {
                        vUv = uv;
                        gl_Position = vec4(position, 1.0);
                    }
                `,
                fragmentShader: document.querySelector('#post-fragment-shader').textContent,
                depthTest: false,
                depthWrite: false
            });

            postScene = new THREE.Scene();
            postCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
            postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), postMaterial));
            resizePostProcessing();
        }

        function resizePostProcessing() {
            renderer.getDrawingBufferSize(postResolution);
            sceneRenderTarget.setSize(
                Math.max(1, postResolution.x),
                Math.max(1, postResolution.y)
            );
        }

        function createPointGrid(stride) {
            const geometry = new THREE.BufferGeometry();
            const columns = Math.ceil(VIDEO_WIDTH / stride);
            const rows = Math.ceil(VIDEO_HEIGHT / stride);
            const vertices = new Float32Array(columns * rows * 3);
            let index = 0;

            for (let y = 0; y < VIDEO_HEIGHT; y += stride) {
                for (let x = 0; x < VIDEO_WIDTH; x += stride) {
                    vertices[index] = x;
                    vertices[index + 1] = y;
                    index += 3;
                }
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
            performanceState.points = columns * rows;
            return geometry;
        }

        function updatePointGrid(quality) {
            const oldGeometry = mesh.geometry;
            mesh.geometry = createPointGrid(QUALITY_STRIDES[quality]);
            oldGeometry.dispose();
            requestRender();
        }

        function createControls(material) {
            controlsGui = new GUI({ title: 'Point cloud controls' });
            const gui = controlsGui;
            gui.domElement.id = 'settings-panel';
            gui.domElement.setAttribute('aria-label', 'Point cloud settings');

            const performanceFolder = gui.addFolder('Performance');
            performanceFolder
                .add(settings, 'quality', Object.keys(QUALITY_STRIDES))
                .name('Point quality')
                .onChange(updatePointGrid);
            performanceFolder
                .add(settings, 'adaptiveResolution')
                .name('Adaptive resolution');
            performanceFolder
                .add(settings, 'maxPixelRatio', MIN_PIXEL_RATIO, 1.5, 0.25)
                .name('Maximum DPR')
                .onChange(() => setPixelRatio(getMaximumPixelRatio()));
            performanceFolder.add(performanceState, 'points').listen().disable().name('Point count');
            performanceFolder.add(performanceState, 'pixelRatio').listen().disable().name('Current DPR');
            performanceFolder.add(performanceState, 'videoFps').listen().disable().name('Video FPS');

            const effectsFolder = gui.addFolder('Image effects');
            effectsFolder
                .add(settings, 'bloomStrength', 0, 0.75, 0.01)
                .name('Bloom')
                .onChange((value) => {
                    postMaterial.uniforms.bloomStrength.value = value;
                });
            effectsFolder
                .add(settings, 'blueHue', 0, 0.12, 0.005)
                .name('Blue hue')
                .onChange((value) => {
                    postMaterial.uniforms.blueHue.value = value;
                });

            const depthFolder = gui.addFolder('Depth mapping');
            depthFolder.add(material.uniforms.nearClipping, 'value', 1, 2000, 1).name('Near depth');
            depthFolder.add(material.uniforms.farClipping, 'value', 1, 6000, 1).name('Far depth');
            depthFolder.add(material.uniforms.pointSize, 'value', 1, 3, 0.25).name('Point size');
            depthFolder.add(material.uniforms.zOffset, 'value', 0, 8000, 1).name('Z offset');

            const clippingFolder = gui.addFolder('Visibility clipping');
            const closeControl = clippingFolder
                .add(material.uniforms.closePlane, 'value', 1, 6000, 1)
                .name('Close plane');
            const farControl = clippingFolder
                .add(material.uniforms.farPlane, 'value', 1, 6000, 1)
                .name('Far plane');
            clippingFolder
                .add(material.uniforms.farPlaneRotation, 'value', -45, 45, 1)
                .name('Far cut angle');
            clippingFolder
                .add(material.uniforms.bottomCrop, 'value', 0, 40, 1)
                .name('Bottom crop (px)');

            closeControl.onChange((value) => {
                if (value > material.uniforms.farPlane.value) {
                    material.uniforms.farPlane.value = value;
                    farControl.updateDisplay();
                }
            });
            farControl.onChange((value) => {
                if (value < material.uniforms.closePlane.value) {
                    material.uniforms.closePlane.value = value;
                    closeControl.updateDisplay();
                }
            });

            const transformFolder = gui.addFolder('Mesh transform');
            transformFolder.add(mesh.position, 'x', -1000, 1000, 1).name('Position X');
            transformFolder.add(mesh.position, 'y', -1000, 5000, 1).name('Position Y');
            transformFolder.add(mesh.position, 'z', -1000, 10000, 1).name('Position Z');
            transformFolder.add(mesh.rotation, 'x', 4, 6, 0.1).name('Rotation X');

            gui.onChange(requestRender);
            gui.hide();
            gui.domElement.setAttribute('aria-hidden', 'true');
        }

        function toggleControls() {
            setControlsVisible(!controlsVisible);
        }

        function setControlsVisible(visible) {
            const focusWasInside = controlsGui.domElement.contains(document.activeElement);
            controlsVisible = visible;

            if (controlsVisible) {
                controlsGui.show();
            } else {
                controlsGui.hide();
            }

            controlsGui.domElement.setAttribute('aria-hidden', String(!controlsVisible));

            if (!controlsVisible && focusWasInside) {
                viewport.focus({ preventScroll: true });
            }

            requestRender();
        }

        function onKeyDown(event) {
            if (!experienceStarted) {
                return;
            }

            const targetIsInteractive = event.target instanceof Element && event.target.closest(
                'input, textarea, select, button, a, [contenteditable="true"]'
            );

            if (
                event.code === 'KeyM' &&
                !event.repeat &&
                !event.altKey &&
                !event.ctrlKey &&
                !event.metaKey &&
                !targetIsInteractive
            ) {
                event.preventDefault();
                toggleAudioMute();
                return;
            }

            if (event.code === 'Escape' && controlsVisible) {
                event.preventDefault();
                setControlsVisible(false);
                return;
            }

            if (
                event.code === 'Period' &&
                !event.repeat &&
                !event.altKey &&
                !event.ctrlKey &&
                !event.metaKey &&
                !targetIsInteractive
            ) {
                event.preventDefault();
                skipToRandomFutureMoment();
                return;
            }

            if (
                TIMELINE_SCRUB_CODES.has(event.code) &&
                !event.altKey &&
                !event.ctrlKey &&
                !event.metaKey &&
                !targetIsInteractive
            ) {
                event.preventDefault();
                if (!event.repeat) {
                    beginTimelineScrub(event.code);
                }
                return;
            }

            if (
                event.code !== 'Space' ||
                event.repeat ||
                event.altKey ||
                event.ctrlKey ||
                event.metaKey ||
                targetIsInteractive
            ) {
                return;
            }

            event.preventDefault();
            toggleControls();
        }

        function onKeyUp(event) {
            if (!heldTimelineKeys.has(event.code)) {
                return;
            }

            event.preventDefault();
            heldTimelineKeys.delete(event.code);

            if (heldTimelineKeys.size === 0) {
                finishTimelineScrub();
            }
        }

        function onWindowBlur() {
            if (timelineScrubActive && !document.hidden) {
                finishTimelineScrub();
            }
        }

        function beginTimelineScrub(keyCode) {
            heldTimelineKeys.add(keyCode);

            if (timelineScrubActive) {
                return;
            }

            timelineScrubActive = true;
            timelineMomentDeck = [];
            video.pause();
            transportStatus.textContent = 'Timeline scrubbing started. Hold for one paused moment per second.';
            showNextTimelineMoment(keyCode);
            timelineScrubTimer = window.setInterval(
                () => showNextTimelineMoment(keyCode),
                TIMELINE_SCRUB_INTERVAL
            );
        }

        function skipToRandomFutureMoment() {
            if (!Number.isFinite(video.duration) || video.duration <= 0) {
                return;
            }

            const maximumTime = Math.max(0, video.duration - 0.001);
            const minimumTarget = Math.min(
                video.currentTime + RANDOM_SKIP_MIN_SECONDS,
                maximumTime
            );
            const maximumTarget = Math.min(
                video.currentTime + RANDOM_SKIP_MAX_SECONDS,
                maximumTime
            );
            let nextTime = THREE.MathUtils.lerp(
                minimumTarget,
                maximumTarget,
                Math.random()
            );

            // A reroll prevents practically identical results when there is
            // enough future timeline left to choose another distinct moment.
            if (
                maximumTarget - minimumTarget > 1 &&
                Math.abs(nextTime - lastRandomSkipTime) < 1
            ) {
                nextTime = minimumTarget + (
                    (nextTime - minimumTarget + (maximumTarget - minimumTarget) * 0.5) %
                    (maximumTarget - minimumTarget)
                );
            }

            lastRandomSkipTime = nextTime;
            video.currentTime = nextTime;
            transportStatus.textContent = `Jumped forward to ${formatVideoTime(nextTime)}.`;
            playTimelineClack();
            flashTitle();
            requestRender();
        }

        function playTimelineClack() {
            if (!audioContext || !audioGain || audioMuted) {
                return;
            }

            const startedAt = audioContext.currentTime;
            const duration = 0.14;
            const sampleCount = Math.ceil(audioContext.sampleRate * duration);
            const noiseBuffer = audioContext.createBuffer(
                1,
                sampleCount,
                audioContext.sampleRate
            );
            const noise = noiseBuffer.getChannelData(0);
            const noiseSource = audioContext.createBufferSource();
            const oscillator = audioContext.createOscillator();
            const lowPass = audioContext.createBiquadFilter();
            const clackGain = audioContext.createGain();

            for (let index = 0; index < sampleCount; index++) {
                const envelope = Math.exp(-index / (audioContext.sampleRate * 0.028));
                noise[index] = (Math.random() * 2 - 1) * envelope;
            }

            noiseSource.buffer = noiseBuffer;
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(105, startedAt);
            oscillator.frequency.exponentialRampToValueAtTime(62, startedAt + duration);
            lowPass.type = 'lowpass';
            lowPass.frequency.setValueAtTime(420, startedAt);
            lowPass.Q.value = 0.7;
            clackGain.gain.setValueAtTime(0.02, startedAt);
            clackGain.gain.exponentialRampToValueAtTime(0.0001, startedAt + duration);

            noiseSource.connect(lowPass);
            oscillator.connect(lowPass);
            // Keep transport feedback audible during the soundtrack fade and
            // low-velocity state instead of multiplying it by that dynamic gain.
            clackGain.connect(audioContext.destination);
            noiseSource.start(startedAt);
            noiseSource.stop(startedAt + duration);
            oscillator.start(startedAt);
            oscillator.stop(startedAt + duration);
        }

        function flashTitle() {
            window.clearTimeout(titleFlashTimer);
            intro.classList.remove('is-skip-flashing');
            intro.hidden = false;

            // Restart the short CSS animation even when skips happen rapidly.
            void intro.offsetWidth;
            intro.classList.add('is-skip-flashing');
            titleFlashTimer = window.setTimeout(() => {
                intro.classList.remove('is-skip-flashing');
                intro.hidden = true;
                titleFlashTimer = 0;
            }, 180);
        }

        function finishTimelineScrub({ resume = true } = {}) {
            if (!timelineScrubActive) {
                return;
            }

            window.clearInterval(timelineScrubTimer);
            timelineScrubTimer = 0;
            timelineScrubActive = false;
            heldTimelineKeys.clear();
            timelineMomentDeck = [];

            if (resume) {
                video.play().catch(() => {
                    status.textContent = 'Click anywhere to resume the depth video.';
                    status.hidden = false;
                    window.addEventListener('pointerdown', retryVideo, { once: true });
                });
                transportStatus.textContent = `Playback resumed at ${formatVideoTime(video.currentTime)}.`;
            }
        }

        function showNextTimelineMoment(keyCode) {
            if (!Number.isFinite(video.duration) || video.duration <= 0) {
                return;
            }

            const maximumTime = Math.max(0, video.duration - 0.001);
            const nextTime = Math.min(getNextTimelineMoment(), maximumTime);

            video.currentTime = nextTime;
            transportStatus.textContent = `Paused timeline moment at ${formatVideoTime(nextTime)}.`;
            requestRender();
        }

        function getNextTimelineMoment() {
            const segmentCount = Math.max(4, Math.min(12, Math.floor(video.duration)));
            const minimumJump = Math.min(8, Math.max(2, video.duration * 0.08));
            let fallbackTime = 0;

            if (timelineMomentDeck.length === 0) {
                timelineMomentDeck = Array.from(
                    { length: segmentCount },
                    (_, index) => index
                );

                for (let index = timelineMomentDeck.length - 1; index > 0; index--) {
                    const randomIndex = Math.floor(Math.random() * (index + 1));
                    [timelineMomentDeck[index], timelineMomentDeck[randomIndex]] =
                        [timelineMomentDeck[randomIndex], timelineMomentDeck[index]];
                }
            }

            while (timelineMomentDeck.length > 0) {
                const segment = timelineMomentDeck.pop();
                const segmentStart = segment / segmentCount * video.duration;
                const segmentLength = video.duration / segmentCount;
                const candidate = segmentStart + segmentLength * (0.15 + Math.random() * 0.7);
                fallbackTime = candidate;

                if (Math.abs(candidate - video.currentTime) >= minimumJump) {
                    return candidate;
                }
            }

            return fallbackTime;
        }

        function formatVideoTime(timeSeconds) {
            const totalSeconds = Math.floor(timeSeconds);
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = String(totalSeconds % 60).padStart(2, '0');
            return `${minutes}:${seconds}`;
        }

        function startRenderScheduler() {
            if ('requestVideoFrameCallback' in HTMLVideoElement.prototype) {
                video.requestVideoFrameCallback(onVideoFrame);
                return;
            }

            scheduleFallbackVideoFrame();
        }

        function onVideoFrame() {
            deliveredVideoFrames++;
            updateAdaptiveResolution();
            requestRender();
            video.requestVideoFrameCallback(onVideoFrame);
        }

        function scheduleFallbackVideoFrame() {
            window.clearTimeout(fallbackFrameTimer);
            fallbackFrameTimer = window.setTimeout(() => {
                if (!document.hidden && !video.paused) {
                    deliveredVideoFrames++;
                    updateAdaptiveResolution();
                    requestRender();
                }
                scheduleFallbackVideoFrame();
            }, document.hidden ? 1000 : 1000 / 30);
        }

        function requestRender() {
            if (document.hidden || renderRequested) {
                return;
            }

            renderRequested = true;
            renderRequest = window.requestAnimationFrame(renderFrame);
        }

        function renderFrame(time) {
            renderRequested = false;

            const frameDeltaTime = lastRenderTime === 0
                ? 1 / 60
                : (time - lastRenderTime) / 1000;
            const deltaTime = Math.min(frameDeltaTime, MAX_FRAME_DELTA);
            lastRenderTime = time;

            let cameraIsMoving;

            if (!experienceStarted) {
                camera.position.copy(cameraEntranceStart);
                cameraLookTarget.copy(cameraEntranceLookTarget);
                cameraIsMoving = false;
            } else if (cameraEntranceActive) {
                // Evolve the existing mouse/spring state without directly
                // applying it while the scripted camera remains in control.
                updateCameraMotion(deltaTime, time / 1000, false);
                cameraIsMoving = updateCameraEntrance(time);
            } else {
                cameraIsMoving = updateCameraMotion(deltaTime, time / 1000);
                cameraLookTarget.copy(center);
            }
            camera.lookAt(cameraLookTarget);
            updatePointDensity();
            updateAudio(frameDeltaTime, time / 1000);

            // This is the only scene render: it feeds the existing post pass,
            // whose output is then drawn to the default framebuffer.
            renderer.setRenderTarget(sceneRenderTarget);
            renderer.render(scene, camera);
            renderer.setRenderTarget(null);
            renderer.render(postScene, postCamera);

            if (cameraIsMoving) {
                requestRender();
            }
        }

        function updatePointDensity() {
            const cameraDistance = camera.position.distanceTo(center);
            const distanceAmount = THREE.MathUtils.smoothstep(
                cameraDistance,
                POINT_DENSITY_NEAR_DISTANCE,
                POINT_DENSITY_FAR_DISTANCE
            );
            mesh.material.uniforms.densityMix.value = 1 - distanceAmount;
        }

        function updateCameraEntrance(time) {
            const duration = reducedMotion.matches
                ? CAMERA_ENTRANCE_DURATION * 0.45
                : CAMERA_ENTRANCE_DURATION;
            const progress = THREE.MathUtils.clamp(
                (time - cameraEntranceStartedAt) / duration,
                0,
                1
            );
            // Smoothstep keeps the long diagonal descent deliberate while
            // avoiding abrupt changes in velocity at either end.
            const easedProgress = progress * progress * (3 - 2 * progress);

            camera.position.lerpVectors(
                cameraEntranceStart,
                cameraInteractivePosition,
                easedProgress
            );
            cameraLookTarget.lerpVectors(
                cameraEntranceLookTarget,
                center,
                easedProgress
            );

            if (progress < 1) {
                return true;
            }

            camera.position.copy(cameraInteractivePosition);
            cameraLookTarget.copy(center);
            cameraEntranceActive = false;
            return true;
        }

        function updateAudio(frameDeltaTime, elapsedTime) {
            const smoothingDeltaTime = Math.min(frameDeltaTime, MAX_FRAME_DELTA);
            const horizontalCameraAmount = THREE.MathUtils.clamp(
                camera.position.x / CAMERA_AUDIO_PAN_RANGE,
                -1,
                1
            );
            const targetPan = horizontalCameraAmount * AUDIO_MAX_PAN;
            const panBlend = 1 - Math.exp(
                -AUDIO_PAN_RESPONSE * smoothingDeltaTime
            );
            currentAudioPan = THREE.MathUtils.lerp(
                currentAudioPan,
                targetPan,
                panBlend
            );

            if (stereoPanner && audioContext) {
                stereoPanner.pan.setValueAtTime(currentAudioPan, audioContext.currentTime);
            }

            if (!audioCameraPositionInitialized) {
                audioCameraPosition.copy(camera.position);
                audioCameraPositionInitialized = true;
            }

            // Frame-to-frame displacement measures the rendered camera itself,
            // so the same velocity signal spans the entrance and mouse control.
            const cameraSpeed = camera.position.distanceTo(audioCameraPosition) /
                Math.max(frameDeltaTime, 1 / 240);
            audioCameraPosition.copy(camera.position);

            const speedBlend = 1 - Math.exp(
                -AUDIO_SPEED_RESPONSE * smoothingDeltaTime
            );
            smoothedCameraSpeed = THREE.MathUtils.lerp(
                smoothedCameraSpeed,
                cameraSpeed,
                speedBlend
            );
            const speedAmount = THREE.MathUtils.smoothstep(
                smoothedCameraSpeed,
                0,
                AUDIO_MAX_SPEED_VOLUME
            );
            const targetMovementVolume = THREE.MathUtils.lerp(
                AUDIO_MIN_VOLUME,
                1,
                speedAmount
            );
            const volumeBlend = 1 - Math.exp(
                -AUDIO_VOLUME_RESPONSE * smoothingDeltaTime
            );
            currentMovementVolume = THREE.MathUtils.lerp(
                currentMovementVolume,
                targetMovementVolume,
                volumeBlend
            );

            const fadeProgress = THREE.MathUtils.clamp(
                (elapsedTime - audioFadeStartedAt) / AUDIO_FADE_DURATION,
                0,
                1
            );
            const fadeAmount = fadeProgress * fadeProgress * (3 - 2 * fadeProgress);
            const targetOutputVolume = audioMuted
                ? 0
                : currentMovementVolume * fadeAmount;
            const outputResponse = audioMuted
                ? AUDIO_MUTE_RESPONSE
                : AUDIO_VOLUME_RESPONSE;
            const outputBlend = 1 - Math.exp(
                -outputResponse * smoothingDeltaTime
            );
            currentAudioOutputVolume = THREE.MathUtils.lerp(
                currentAudioOutputVolume,
                targetOutputVolume,
                outputBlend
            );

            if (audioGain && audioContext) {
                audioGain.gain.setValueAtTime(
                    currentAudioOutputVolume,
                    audioContext.currentTime
                );
            } else {
                soundtrack.volume = currentAudioOutputVolume;
            }
        }

        function updateCameraMotion(deltaTime, elapsedTime, applyToCamera = true) {
            const motionEnabled = !reducedMotion.matches;
            const wobbleX = motionEnabled
                ? WOBBLE_WIDTH_PIXELS * POINTER_SCALE * 0.5 * (
                    Math.sin(elapsedTime * 0.22) * 0.62 +
                    Math.sin(elapsedTime * 0.13 + 1.7) * 0.38
                )
                : 0;
            const wobbleY = motionEnabled
                ? WOBBLE_HEIGHT_PIXELS * POINTER_SCALE * 0.5 * (
                    Math.sin(elapsedTime * 0.17 + 0.9) * 0.55 +
                    Math.cos(elapsedTime * 0.09 + 2.1) * 0.45
                )
                : 0;

            // Mouse input and organic drift share one target, so the same spring
            // blends both sources instead of layering a separate camera animation.
            cameraTarget.set(
                (motionEnabled ? pointer.x : 0) + wobbleX,
                (motionEnabled ? -pointer.y : 0) + wobbleY
            );

            cameraTargetDelta.set(
                cameraTarget.x - cameraInteractivePosition.x,
                cameraTarget.y - cameraInteractivePosition.y
            );

            // A damped spring provides the target acceleration. Tanh saturation
            // avoids a hard acceleration edge when the mouse target jumps.
            desiredCameraAcceleration
                .copy(cameraTargetDelta)
                .multiplyScalar(CAMERA_SPRING_STRENGTH)
                .addScaledVector(cameraVelocity, -CAMERA_DAMPING);

            const requestedAcceleration = desiredCameraAcceleration.length();
            if (requestedAcceleration > 0) {
                const softenedAcceleration = CAMERA_MAX_ACCELERATION * Math.tanh(
                    requestedAcceleration / CAMERA_MAX_ACCELERATION
                );
                desiredCameraAcceleration.multiplyScalar(
                    softenedAcceleration / requestedAcceleration
                );
            }

            const currentSpeed = cameraVelocity.length();
            if (
                currentSpeed > 0 &&
                desiredCameraAcceleration.dot(cameraVelocity) > 0
            ) {
                const velocityDirectionX = cameraVelocity.x / currentSpeed;
                const velocityDirectionY = cameraVelocity.y / currentSpeed;
                const forwardAcceleration = Math.max(
                    0,
                    cameraAcceleration.x * velocityDirectionX +
                    cameraAcceleration.y * velocityDirectionY
                );
                const projectedSpeed = currentSpeed +
                    forwardAcceleration * CAMERA_SPEED_LOOKAHEAD;
                const speedFade = 1 - THREE.MathUtils.smoothstep(
                    projectedSpeed,
                    CAMERA_MAX_SPEED * CAMERA_SPEED_FADE_START,
                    CAMERA_MAX_SPEED
                );
                desiredCameraAcceleration.multiplyScalar(speedFade);
            }

            // Low-pass the acceleration itself. This limits jerk and removes the
            // obvious instant switch between starting, cruising, and braking.
            const accelerationBlend = 1 - Math.exp(
                -CAMERA_ACCELERATION_RESPONSE * deltaTime
            );
            cameraAcceleration.lerp(desiredCameraAcceleration, accelerationBlend);

            cameraVelocity.addScaledVector(cameraAcceleration, deltaTime);

            // Safety cap. The smooth speed fade normally prevents reaching it.
            if (cameraVelocity.length() > CAMERA_MAX_SPEED) {
                cameraVelocity.setLength(CAMERA_MAX_SPEED);
            }

            cameraInteractivePosition.x += cameraVelocity.x * deltaTime;
            cameraInteractivePosition.y += cameraVelocity.y * deltaTime;

            if (applyToCamera) {
                camera.position.copy(cameraInteractivePosition);
            }

            const remainingDistance = cameraTargetDelta.length();

            return motionEnabled ||
                remainingDistance > CAMERA_POSITION_EPSILON ||
                cameraVelocity.length() > CAMERA_VELOCITY_EPSILON ||
                cameraAcceleration.length() > CAMERA_ACCELERATION_EPSILON;
        }

        function updateAdaptiveResolution() {
            const now = performance.now();
            const elapsed = now - performanceWindowStarted;
            if (elapsed < 2000) {
                return;
            }

            const fps = deliveredVideoFrames * 1000 / elapsed;
            performanceState.videoFps = Math.round(fps);

            if (settings.adaptiveResolution) {
                const maximum = getMaximumPixelRatio();
                if (fps < 24 && performanceState.pixelRatio > MIN_PIXEL_RATIO) {
                    setPixelRatio(performanceState.pixelRatio - 0.25);
                    stablePerformanceWindows = 0;
                } else if (fps >= 28 && performanceState.pixelRatio < maximum) {
                    stablePerformanceWindows++;
                    if (stablePerformanceWindows >= 3) {
                        setPixelRatio(performanceState.pixelRatio + 0.25);
                        stablePerformanceWindows = 0;
                    }
                } else {
                    stablePerformanceWindows = 0;
                }
            }

            deliveredVideoFrames = 0;
            performanceWindowStarted = now;
        }

        function getMaximumPixelRatio() {
            return Math.max(
                MIN_PIXEL_RATIO,
                Math.min(window.devicePixelRatio || 1, settings.maxPixelRatio)
            );
        }

        function setPixelRatio(value) {
            const nextValue = Math.max(
                MIN_PIXEL_RATIO,
                Math.min(value, getMaximumPixelRatio())
            );
            performanceState.pixelRatio = Math.round(nextValue * 100) / 100;

            if (renderer) {
                renderer.setPixelRatio(performanceState.pixelRatio);
                renderer.setSize(window.innerWidth, window.innerHeight);
                if (sceneRenderTarget) {
                    resizePostProcessing();
                }
                requestRender();
            }
        }

        async function startVideo() {
            try {
                await video.play();
            } catch {
                status.textContent = 'Click anywhere to start the depth video.';
                status.hidden = false;
                window.addEventListener('pointerdown', retryVideo, { once: true });
            }
        }

        async function retryVideo() {
            try {
                await video.play();
            } catch {
                status.textContent = 'Video playback is blocked by this browser.';
            }
        }

        function onPointerMove(event) {
            if (!experienceStarted) {
                return;
            }

            pointer.x = (event.clientX - window.innerWidth / 2) * POINTER_SCALE;
            pointer.y = (event.clientY - window.innerHeight / 2) * POINTER_SCALE;
            requestRender();
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            setPixelRatio(Math.min(performanceState.pixelRatio, getMaximumPixelRatio()));
            requestRender();
        }

        async function onVisibilityChange() {
            if (document.hidden) {
                wasPlayingBeforeHidden = timelineScrubActive || !video.paused;
                wasSoundtrackPlayingBeforeHidden = !soundtrack.paused;
                finishTimelineScrub({ resume: false });
                video.pause();
                soundtrack.pause();
                window.cancelAnimationFrame(renderRequest);
                renderRequested = false;
                lastRenderTime = 0;
                return;
            }

            performanceWindowStarted = performance.now();
            deliveredVideoFrames = 0;
            if (wasPlayingBeforeHidden) {
                try {
                    await video.play();
                } catch {
                    status.textContent = 'Click anywhere to resume the depth video.';
                    status.hidden = false;
                    window.addEventListener('pointerdown', retryVideo, { once: true });
                }
            }
            if (wasSoundtrackPlayingBeforeHidden) {
                soundtrack.play().catch(() => {
                    transportStatus.textContent = 'Click the entry control to resume audio.';
                });
            }
            requestRender();
        }
    </script>
</body>
</html>
